# Build unsigned IPA for Sideloadly (Windows) or Mac installers.

name: Build ScrollPress IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-ipa:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find project root
        id: root
        run: |
          set -euo pipefail
          echo "=== Repo contents ==="
          ls -la
          if [ -f "ScrollPress.xcodeproj/project.pbxproj" ]; then
            echo "root=." >> "$GITHUB_OUTPUT"
          elif [ -f "ScrollPress/ScrollPress.xcodeproj/project.pbxproj" ]; then
            echo "root=ScrollPress" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: ScrollPress.xcodeproj not found at repo root."
            find . -maxdepth 4 -name "*.xcodeproj" || true
            exit 1
          fi

      - name: Verify project files
        working-directory: ${{ steps.root.outputs.root }}
        run: |
          set -euo pipefail
          test -f ScrollPress.xcodeproj/project.pbxproj
          test -d ScrollPress
          test -f ScrollPress/Info.plist
          echo "=== Xcode targets ==="
          xcodebuild -list -project ScrollPress.xcodeproj
          echo "=== App icon ==="
          ls -la ScrollPress/Assets.xcassets/AppIcon.appiconset/ || true

      - name: Build (unsigned)
        working-directory: ${{ steps.root.outputs.root }}
        run: |
          set -euo pipefail
          mkdir -p build
          set +e
          xcodebuild \
            -project ScrollPress.xcodeproj \
            -target ScrollPress \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee build/xcodebuild.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            echo "===== LAST 80 LINES OF BUILD LOG ====="
            tail -n 80 build/xcodebuild.log
            exit "$STATUS"
          fi

      - name: Package IPA
        working-directory: ${{ steps.root.outputs.root }}
        run: |
          set -euo pipefail
          APP_PATH=$(find build/DerivedData/Build/Products -name "ScrollPress.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: ScrollPress.app not found"
            find build/DerivedData -type d -name "*.app" || true
            exit 1
          fi
          echo "Packaging: $APP_PATH"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          (cd build && zip -qr ScrollPress.ipa Payload)
          ls -lh build/ScrollPress.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScrollPress-ipa
          path: ${{ steps.root.outputs.root }}/build/ScrollPress.ipa
          if-no-files-found: error
          retention-days: 14
